<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{FONTS}}
:root { {{PALETTE}}
        --bg:var(--page); --ink-p:var(--ink); --mut:var(--muted-p); --line:color-mix(in srgb, var(--ink) 25%, transparent); --pan:var(--panel); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:var(--dark); --ink-p:var(--chalk); --mut:color-mix(in srgb, var(--chalk) 62%, var(--dark)); --line:color-mix(in srgb, var(--chalk) 22%, transparent); --pan:color-mix(in srgb, var(--dark) 86%, var(--chalk)); } }
:root[data-theme="dark"] { --bg:var(--dark); --ink-p:var(--chalk); --mut:color-mix(in srgb, var(--chalk) 62%, var(--dark)); --line:color-mix(in srgb, var(--chalk) 22%, transparent); --pan:color-mix(in srgb, var(--dark) 86%, var(--chalk)); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink-p); font-family: var(--f-mono), monospace; }
body { font-size: 14px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 60px; }
header .eb { letter-spacing: .2em; font-size: 12px; color: var(--mut); text-transform: uppercase; }
header h1 { font-family: var(--f-disp), sans-serif; font-weight: 600; font-size: clamp(34px, 6vw, 56px); margin: 2px 0 4px; letter-spacing: .01em; line-height: 1.05; }
header p { margin: 0 0 14px; max-width: 70ch; color: var(--mut); }
.ex-stage-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--paper); overflow: hidden; border: 1px solid var(--line); }
.ex-stage-frame canvas, .ex-stage-frame svg { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
.ex-svg text { font-kerning: normal; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
button, .chip { font: inherit; font-size: 12.5px; letter-spacing: .06em; background: transparent; color: var(--ink-p); border: 1px solid var(--ink-p); border-radius: 14px; padding: 4px 12px; cursor: pointer; }
button.on, .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#scrub { flex: 1 1 240px; min-width: 0; accent-color: var(--accent); }
#tm { min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
.chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chapters button { font-size: 11.5px; padding: 3px 9px; border-radius: 3px; }
.chapters button.card { border-style: dashed; opacity: .75; }
.rail { min-height: 46px; border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--pan); margin: 8px 0 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rail:empty { display: none; }
.ask { z-index: 5; position: absolute; right: 3.1%; top: 27.8%; width: 24%; min-width: 200px; background: var(--chalk); color: var(--ink); border: 2px solid var(--ink); padding: 12px 14px; display: none; font-size: clamp(11px, 1.3vw, 15px); }
.ask.show { display: block; }
.ask h3 { font-family: var(--f-disp), sans-serif; font-weight: 600; margin: 0 0 4px; font-size: 1.6em; letter-spacing: .04em; }
.ask p { margin: 0 0 8px; }
.ask input { width: 5.5em; font: inherit; font-size: 1.4em; padding: 2px 6px; border: 1px solid var(--ink); background: #fff; color: var(--ink); }
.ask button { color: var(--ink); border-color: var(--ink); }
.ask .bar { height: 3px; background: var(--accent); margin-top: 8px; transform-origin: left; }
section { margin-top: 28px; }
h2 { font-family: var(--f-disp), sans-serif; font-weight: 600; font-size: 28px; letter-spacing: .03em; margin: 0 0 8px; }
.try { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; background: var(--pan); border: 1px solid var(--line); padding: 16px; }
@media (max-width: 720px) { .try { grid-template-columns: 1fr; } }
.try label { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin: 10px 0 4px; }
.try input[type=range] { width: 100%; accent-color: var(--accent); }
.out .big { font-family: var(--f-disp), sans-serif; font-weight: 600; font-size: 64px; line-height: 1; }
.out .ex { font-size: 13px; }
.out p { color: var(--mut); margin: 6px 0; }
.transcript { columns: 2 320px; column-gap: 28px; font-size: 13px; }
.transcript div { break-inside: avoid; margin: 0 0 6px; cursor: pointer; }
.transcript b { color: var(--accent); font-weight: 500; margin-right: 6px; }
.sources li { margin-bottom: 4px; }
.honest { font-size: 13px; color: var(--mut); max-width: 80ch; }
/* film mode: the bare stage */
body.film { background: #000; overflow: hidden; }
body.film .wrap > *:not(#stageHost) { display: none !important; }
body.film .wrap { padding: 0; max-width: none; }
body.film #stage { width: 1920px; height: 1080px; aspect-ratio: auto; border: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eb">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <p>{{LEDE}}</p>
  </header>
  <div id="stageHost"><div id="stage" class="ex-stage-frame"><div class="ask" id="ask" role="dialog" aria-label="Seal your number">
    <h3 id="askH">YOUR NUMBER</h3>
    <p id="askP"></p>
    <div><input id="askIn" type="number" inputmode="decimal" aria-label="your number"> <span id="askU"></span> <button id="askGo">Seal</button> <button id="askNo">No answer</button></div>
    <div class="bar" id="askBar"></div>
  </div></div></div>
  <div class="ctrls">
    <button id="play" aria-label="play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="75" step="0.1" value="0" aria-label="scrub">
    <span id="tm">0:00</span>
    <button id="cc" class="on" aria-pressed="true">CC</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <div class="rail" id="rail"></div>

  <section id="try">
    <h2 id="tryH">Try it</h2>
    <div class="try">
      <div><p class="honest" id="tryNote"></p><div id="tryIn"></div></div>
      <div class="out" id="tryOut"></div>
    </div>
  </section>

  <section>
    <h2>Transcript</h2>
    <div class="transcript" id="transcript"></div>
  </section>
  <section>
    <h2>Sources and honest limits</h2>
    <ul class="sources" id="sources"></ul>
    <div id="honest"></div>
  </section>
</div>
{{P5}}
{{FILM}}
{{KIT}}
{{FILMJS}}
{{PLAYER}}
</body>
</html>
