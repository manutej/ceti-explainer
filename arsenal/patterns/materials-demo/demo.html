<!doctype html>
<meta charset="utf-8"><title>materials-demo</title>
<style>
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(../../../vendor/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
html,body{margin:0;background:#111}canvas{display:block}
</style>
<script src="../../../vendor/p5-2.3.4.min.js"></script>
<script src="../../materials/drawn/materials.js"></script>
<script src="./pattern.js"></script>
<script>
const PAT = ARSENAL.patterns['materials-demo'], q = new URLSearchParams(location.search);
const TK = { id: 'ceti-dark', color: { bg: '#0F1115', ink: '#EDE8DF', accent: '#E0B27A', accent2: '#B8322A', muted: '#8B8778', line: 'rgba(237,232,223,0.18)', panel: '#171A21', chalk: '#F6F3EC' },
  type: { disp: { family: 'Big Shoulders Display', weight: 600 }, mono: { family: 'IBM Plex Mono', weight: 400 }, body: { family: 'DM Sans', weight: 400 } }, texture: 'none', tempo: { ease: 'cubic', beat_s: 4 } };
let P, state = null, cur = { variant: q.get('variant') || 'ink', t: +(q.get('t') || PAT.params.dur) };
const params = v => Object.assign({}, PAT.params, (PAT.variants.find(x => x.name === v) || PAT.variants[0]).params);
function render(t, v) {
  cur = { variant: v || cur.variant, t };
  if (!state) state = PAT.setup(P, { seed: 7 }, params(cur.variant));
  PAT.draw(P, t, state, params(cur.variant), TK);
}
let resolveReady; const readyP = new Promise(r => resolveReady = r);
window.__film = { ready: () => readyP, seek: (t, v) => render(t, v), info: { variants: PAT.variants.map(v => v.name), dur: PAT.params.dur } };
new p5(p => {
  p.setup = async () => { p.createCanvas(960, 540); p.pixelDensity(2); p.noLoop(); P = p;
    try { await document.fonts.load('400 14px "IBM Plex Mono"'); } catch (e) {}
    render(cur.t, cur.variant); resolveReady(); };
  p.draw = () => {};
}, document.body);
</script>
