<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>morph-type</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#0F1115}canvas{display:block}</style>
<script src="../../../vendor/p5-2.3.4.min.js"></script>
<script src="../../fonts/fonts.js"></script>
<script src="./pattern.js"></script>
</head><body><script>
// brand packs inline (file:// cannot fetch); pick with ?brand=<id>
const BRANDS = {};
BRANDS['ceti-dark'] = { "id": "ceti-dark", "name": "CETI dark", "color": { "bg": "#0F1115", "ink": "#EDE8DF", "accent": "#E0B27A", "accent2": "#B8322A", "muted": "#8B8778", "line": "rgba(237,232,223,0.18)", "panel": "#171A21", "chalk": "#F6F3EC" }, "type": { "disp": { "family": "Big Shoulders Display", "weight": 600 }, "mono": { "family": "IBM Plex Mono", "weight": 400 }, "body": { "family": "DM Sans", "weight": 400 } }, "texture": "none", "tempo": { "ease": "cubic", "beat_s": 4 }, "voice": { "register": "typeset numbers, few words", "end_card": "CETI" } };
BRANDS['neon-lab'] = { "id": "neon-lab", "name": "Neon lab (dark, luminous)", "color": { "bg": "#07080C", "ink": "#E8F1FF", "accent": "#3DF5C3", "accent2": "#FF4FA3", "muted": "#7C86A2", "line": "rgba(232,241,255,0.16)", "panel": "#0E1119", "chalk": "#FFFFFF" }, "type": { "disp": { "family": "Sofia Sans Extra Condensed", "weight": 700 }, "mono": { "family": "Space Mono", "weight": 400 }, "body": { "family": "DM Sans", "weight": 400 } }, "texture": "grain", "tempo": { "ease": "expo", "beat_s": 3 }, "voice": { "register": "glow on black, thin rules", "end_card": "CETI" } };
BRANDS['swiss-grid'] = { "id": "swiss-grid", "name": "Swiss grid (clean, high contrast)", "color": { "bg": "#FFFFFF", "ink": "#111111", "accent": "#E63312", "accent2": "#1F4FB8", "muted": "#6B6B6B", "line": "rgba(17,17,17,0.2)", "panel": "#F2F2F2", "chalk": "#000000" }, "type": { "disp": { "family": "Jost", "weight": 600 }, "mono": { "family": "Red Hat Mono", "weight": 400 }, "body": { "family": "Jost", "weight": 400 } }, "texture": "none", "tempo": { "ease": "expo", "beat_s": 3 }, "voice": { "register": "grid, flush left, one accent", "end_card": "CETI" } };
BRANDS['tender-set'] = { "id": "tender-set", "name": "Tender set (the Opera House sheet)", "color": { "bg": "#E8DCC2", "ink": "#1E3A5C", "accent": "#C8452E", "accent2": "#B9A277", "muted": "#716B5F", "line": "rgba(30,58,92,0.25)", "panel": "#F5EEDF", "chalk": "#0F2540" }, "type": { "disp": { "family": "Big Shoulders Display", "weight": 600 }, "mono": { "family": "IBM Plex Mono", "weight": 400 }, "body": { "family": "IBM Plex Mono", "weight": 400 } }, "texture": "paper", "tempo": { "ease": "cubic", "beat_s": 4 }, "voice": { "register": "drafting sheet, revisions ledger", "end_card": "CETI" } };
const Q = new URLSearchParams(location.search);
const tokens = BRANDS[Q.get('brand')] || BRANDS['ceti-dark'];
const PAT = ARSENAL.patterns['morph-type'], DUR = 6, SEED = 7;
const states = {}; let cur = null, tcur = 0, P5;
function merged(name) { const v = PAT.variants.find(x => x.name === name) || PAT.variants[0]; return Object.assign({}, PAT.params, v.params); }
function render() {
  if (!cur) return; const p = P5, prm = merged(cur);
  p.push(); p.resetMatrix(); PAT.draw(p, tcur, states[cur], prm, tokens); p.pop();
}
let resolveReady; const readyP = new Promise(r => (resolveReady = r));
new p5(p => {
  P5 = p;
  p.setup = async () => {
    p.createCanvas(960, 540); p.pixelDensity(2); p.noLoop(); p.draw = () => {};
    p.describe('Kinetic typography: outlines of words and digits morphing into one another.');
    for (const v of PAT.variants) states[v.name] = await PAT.setup(p, { seed: SEED, tokens, W: 960, H: 540 }, merged(v.name));
    cur = PAT.variants[0].name;
    const qv = Q.get('variant'); if (qv) cur = qv; if (Q.get('t')) tcur = +Q.get('t');
    render(); resolveReady();
  };
});
window.__film = {
  ready: () => readyP,
  seek(t, v) { if (v) cur = v; tcur = t; render(); },
  info: { variants: PAT.variants.map(v => v.name), dur: DUR, atlas: PAT.atlas },
};
</script></body></html>
