@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url('../../../vendor/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:600;src:url('../../../vendor/fonts/big-shoulders-display-latin-600-normal.woff2') format('woff2')}
html,body{margin:0;background:#0F1115}canvas{display:block}

<script src="../../../vendor/p5-2.3.4.min.js"></script>
<script src="./pattern.js"></script>
<script>
const Q = new URLSearchParams(location.search);
let BRAND = {"id":"ceti-dark","color":{"bg":"#0F1115","ink":"#EDE8DF","accent":"#E0B27A","accent2":"#B8322A","muted":"#8B8778","line":"rgba(237,232,223,0.18)","panel":"#171A21","chalk":"#F6F3EC"},"type":{"disp":{"family":"Big Shoulders Display","weight":600},"mono":{"family":"IBM Plex Mono","weight":400},"body":{"family":"DM Sans","weight":400}},"texture":"none","tempo":{"ease":"cubic","beat_s":4}};
const PAT = ARSENAL.patterns.layers, DUR = PAT.params.dur, SEED = 23;
const states = {}; let cur = Q.get('variant') || PAT.variants[0].name, tcur = +(Q.get('t') || 0), P5;
function prm(name) { const v = PAT.variants.find(v => v.name === name); return Object.assign({}, PAT.params, v.params); }
function stateFor(name) { return states[name] || (states[name] = PAT.setup(P5, { seed: SEED, W: 960, H: 540, density: 2 }, prm(name))); }
function render(t, name) { cur = name || cur; P5.resetMatrix(); PAT.draw(P5, t, stateFor(cur), prm(cur), BRAND); }
let resolveReady; const readyP = new Promise(r => resolveReady = r);
window.__film = { ready: () => readyP, seek(t, v) { tcur = t; render(t, v); }, info: { variants: PAT.variants.map(v => v.name), dur: DUR } };
async function loadBrand() { const b = Q.get('brand'); if (!b) return; try { BRAND = await (await fetch('../../brands/' + b + '.json')).json(); } catch (e) {} }
new p5(p => {
  p.setup = async () => {
    P5 = p; p.createCanvas(960, 540); p.pixelDensity(2); p.noLoop(); p.describe('Layered compositing demo: frozen layers, cutout reveal and pure-of-t trails.');
    await loadBrand(); try { await document.fonts.load('11px "IBM Plex Mono"'); } catch (e) {}
    render(tcur, cur); resolveReady();
  };
  p.draw = () => {};
});
</script>
