<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>physics pattern demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Big Shoulders Display';font-weight:600;src:url('../../../vendor/fonts/big-shoulders-display-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url('../../../vendor/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-weight:400;src:url('../../../vendor/fonts/dm-sans-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Sofia Sans Extra Condensed';font-weight:700;src:url('../../../vendor/fonts/sofia-sans-extra-condensed-latin-700-normal.woff2') format('woff2');}
@font-face{font-family:'Space Mono';font-weight:400;src:url('../../../vendor/fonts/space-mono-latin-400-normal.woff2') format('woff2');}
html,body{margin:0;background:#0F1115} canvas{display:block}
</style>
<script src="../../../vendor/p5-2.3.4.min.js"></script>
<script src="./pattern.js"></script>
</head><body>
<script>
const PACKS = {"ceti-dark": {"id": "ceti-dark", "name": "CETI dark", "color": {"bg": "#0F1115", "ink": "#EDE8DF", "accent": "#E0B27A", "accent2": "#B8322A", "muted": "#8B8778", "line": "rgba(237,232,223,0.18)", "panel": "#171A21", "chalk": "#F6F3EC"}, "type": {"disp": {"family": "Big Shoulders Display", "weight": 600}, "mono": {"family": "IBM Plex Mono", "weight": 400}, "body": {"family": "DM Sans", "weight": 400}}, "texture": "none", "tempo": {"ease": "cubic", "beat_s": 4}, "voice": {"register": "typeset numbers, few words", "end_card": "CETI"}}, "neon-lab": {"id": "neon-lab", "name": "Neon lab (dark, luminous)", "color": {"bg": "#07080C", "ink": "#E8F1FF", "accent": "#3DF5C3", "accent2": "#FF4FA3", "muted": "#7C86A2", "line": "rgba(232,241,255,0.16)", "panel": "#0E1119", "chalk": "#FFFFFF"}, "type": {"disp": {"family": "Sofia Sans Extra Condensed", "weight": 700}, "mono": {"family": "Space Mono", "weight": 400}, "body": {"family": "DM Sans", "weight": 400}}, "texture": "grain", "tempo": {"ease": "expo", "beat_s": 3}, "voice": {"register": "glow on black, thin rules", "end_card": "CETI"}}};
const qs = new URLSearchParams(location.search);
const TOK = PACKS[qs.get('brand')] || PACKS['ceti-dark'];
const PAT = ARSENAL.patterns.physics, DUR = PAT.params.dur;
const cache = {}; let cur = null, cv = null, fontsReady;
function stateFor(name) {
  if (!cache[name]) { const v = PAT.variants.find(x => x.name === name) || PAT.variants[0]; cache[name] = PAT.setup(P5, { seed: PAT.params.seed }, v.params); }
  return cache[name];
}
let P5;
new p5((p) => {
  P5 = p;
  p.setup = () => { p.pixelDensity(2); cv = p.createCanvas(960, 540); p.noLoop(); p.describe('Simulated motion that scrubs: springs, a pour, a flock.'); };
  p.draw = () => { if (cur) PAT.draw(p, cur.t, stateFor(cur.v), {}, TOK); };
});
window.__film = {
  info: { variants: PAT.variants.map(v => v.name), dur: DUR, brand: TOK.id },
  ready: async () => {
    while (!P5 || !P5.width) await new Promise(r => setTimeout(r, 10));
    try { await Promise.all(['600 20px "Big Shoulders Display"','400 12px "IBM Plex Mono"','700 20px "Sofia Sans Extra Condensed"','400 12px "Space Mono"'].map(f => document.fonts.load(f))); } catch (e) {}
    __film.info.maxErr = stateFor('settle').maxErr; __film.info.keys = stateFor('settle').sim.keys; return true;
  },
  seek: (t, v) => { cur = { t, v: v || qs.get("variant") || PAT.variants[0].name }; PAT.draw(P5, cur.t, stateFor(cur.v), {}, TOK); return t; }
};
(function () { const t = parseFloat(qs.get('t')); const v = qs.get('variant'); if (!isNaN(t) || v) { const go = () => P5 && P5.width ? __film.seek(isNaN(t) ? 0 : t, v) : setTimeout(go, 20); go(); } })();
</script>
</body></html>
