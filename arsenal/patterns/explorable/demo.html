<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorable</title>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:600;src:url(../../../vendor/fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(../../../vendor/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:400;src:url(../../../vendor/fonts/dm-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:400;src:url(../../../vendor/fonts/jost-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:600;src:url(../../../vendor/fonts/jost-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Red Hat Mono";font-weight:400;src:url(../../../vendor/fonts/red-hat-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Sofia Sans Extra Condensed";font-weight:700;src:url(../../../vendor/fonts/sofia-sans-extra-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Space Mono";font-weight:400;src:url(../../../vendor/fonts/space-mono-latin-400-normal.woff2) format("woff2")}
:root{--bg:#0F1115;--ink:#EDE8DF;--accent:#E0B27A;--accent2:#B8322A;--muted:#8B8778;--line:rgba(237,232,223,.18);--panel:#171A21;--chalk:#F6F3EC;--disp:"Big Shoulders Display";--mono:"IBM Plex Mono";--body:"DM Sans"}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body),sans-serif}
main{max-width:960px;margin:0 auto}
header,.panel,footer{padding-left:16px;padding-right:16px}
header{padding-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font:600 26px/1 var(--disp),sans-serif;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:400 13px var(--mono),monospace;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
canvas{display:block;width:100%!important;height:auto!important;margin-top:12px}
.panel{background:var(--panel);padding-top:14px;padding-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 24px}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label,.ctl .lab{font:400 12px var(--mono),monospace;color:var(--muted)}
.ctl output{color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
input[type=number]{font:400 14px var(--mono),monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:8em;min-height:40px}
.read{padding:12px 16px 0;margin:0}
.read span{display:block}
.formulas{margin:8px 16px 0;padding:0;list-style:none;font:400 12px var(--mono),monospace;color:var(--muted)}
.limit{margin:8px 16px 0;font:400 13px var(--mono),monospace;color:var(--ink)}
.limit b{color:var(--accent);font-weight:400}
footer{padding-top:16px;padding-bottom:24px;font:400 12px var(--mono),monospace;color:var(--muted)}
footer a{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="ttl">Explorables</h1>
    <div class="chips" id="tabs" role="group" aria-label="Choose an explorable"></div>
  </header>
  <div id="stage"></div>
  <footer>Brand: <span id="brands"></span> &middot; every number comes from the claims shown above; state is the controls, nothing else.</footer>
</main>
<script src="../../../vendor/p5-2.3.4.min.js"></script>
<script src="./pattern.js"></script>
<script>
const BRANDS = {"ceti-dark":{"id":"ceti-dark","name":"CETI dark","color":{"bg":"#0F1115","ink":"#EDE8DF","accent":"#E0B27A","accent2":"#B8322A","muted":"#8B8778","line":"rgba(237,232,223,0.18)","panel":"#171A21","chalk":"#F6F3EC"},"type":{"disp":{"family":"Big Shoulders Display","weight":600},"mono":{"family":"IBM Plex Mono","weight":400},"body":{"family":"DM Sans","weight":400}},"texture":"none","tempo":{"ease":"cubic","beat_s":4},"voice":{"register":"typeset numbers, few words","end_card":"CETI"}},"neon-lab":{"id":"neon-lab","name":"Neon lab (dark, luminous)","color":{"bg":"#07080C","ink":"#E8F1FF","accent":"#3DF5C3","accent2":"#FF4FA3","muted":"#7C86A2","line":"rgba(232,241,255,0.16)","panel":"#0E1119","chalk":"#FFFFFF"},"type":{"disp":{"family":"Sofia Sans Extra Condensed","weight":700},"mono":{"family":"Space Mono","weight":400},"body":{"family":"DM Sans","weight":400}},"texture":"grain","tempo":{"ease":"expo","beat_s":3},"voice":{"register":"glow on black, thin rules","end_card":"CETI"}},"swiss-grid":{"id":"swiss-grid","name":"Swiss grid (clean, high contrast)","color":{"bg":"#FFFFFF","ink":"#111111","accent":"#E63312","accent2":"#1F4FB8","muted":"#6B6B6B","line":"rgba(17,17,17,0.2)","panel":"#F2F2F2","chalk":"#000000"},"type":{"disp":{"family":"Jost","weight":600},"mono":{"family":"Red Hat Mono","weight":400},"body":{"family":"Jost","weight":400}},"texture":"none","tempo":{"ease":"expo","beat_s":3},"voice":{"register":"grid, flush left, one accent","end_card":"CETI"}},"tender-set":{"id":"tender-set","name":"Tender set (the Opera House sheet)","color":{"bg":"#E8DCC2","ink":"#1E3A5C","accent":"#C8452E","accent2":"#B9A277","muted":"#716B5F","line":"rgba(30,58,92,0.25)","panel":"#F5EEDF","chalk":"#0F2540"},"type":{"disp":{"family":"Big Shoulders Display","weight":600},"mono":{"family":"IBM Plex Mono","weight":400},"body":{"family":"IBM Plex Mono","weight":400}},"texture":"paper","tempo":{"ease":"cubic","beat_s":4},"voice":{"register":"drafting sheet, revisions ledger","end_card":"CETI"}}};
const PAT = ARSENAL.patterns.explorable, qs = new URLSearchParams(location.search);
const brandId = BRANDS[qs.get('brand')] ? qs.get('brand') : 'ceti-dark', tokens = BRANDS[brandId];
const css = document.documentElement.style;
for (const k of ['bg','ink','accent','accent2','muted','line','panel','chalk']) css.setProperty('--' + k, tokens.color[k]);
for (const k of ['disp','mono','body']) css.setProperty('--' + k, '"' + tokens.type[k].family + '"');
document.getElementById('brands').innerHTML = Object.keys(BRANDS).map(b => b === brandId ? `<b>${b}</b>` : `<a href="?brand=${b}">${b}</a>`).join(' &middot; ');
document.title = 'Explorable (' + brandId + ')';

const NAMES = PAT.variants.map(v => v.name), STAGE = document.getElementById('stage'), TABS = document.getElementById('tabs');
const cells = {};   // variant name -> { st, p, section, render, sync }
let active = null, ready = false, resolveReady;
const readyP = new Promise(r => resolveReady = r);

function buildSection(variant) {
  const kind = variant.params.kind, claims = PAT.CLAIMS[kind];
  const sec = document.createElement('section'); sec.hidden = true; sec.setAttribute('aria-label', claims.title);
  sec.innerHTML = `<div class="host"></div><div class="panel"></div><p class="read" aria-live="polite"></p><ul class="formulas"></ul><p class="limit"><b>Honest limit.</b> ${claims.limit}</p>`;
  sec.querySelector('.formulas').innerHTML = claims.formulas.map(f => `<li>${f}</li>`).join('');
  STAGE.appendChild(sec);
  const cell = { sec, kind, name: variant.name, syncers: [] }; cells[variant.name] = cell;
  new p5(p => {
    p.setup = () => {
      p.createCanvas(PAT.W, PAT.H).parent(sec.querySelector('.host')); p.pixelDensity(2); p.noLoop();
      cell.p = p; cell.st = PAT.setup(p, { seed: 20260508 }, Object.assign({}, PAT.params, variant.params));
      const panel = sec.querySelector('.panel'), v = cell.st.vals;
      const set = (id, x) => { v[id] = PAT.snap(id, x); cell.sync(); };
      PAT.CONTROLS[kind].forEach((c, i) => {
        const box = document.createElement('div'); box.className = 'ctl'; panel.appendChild(box);
        const uid = `${variant.name}-${c.id}-${i}`;
        if (c.type === 'chips') {
          const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = c.label; box.appendChild(lab);
          const row = document.createElement('div'); row.className = 'chips'; row.setAttribute('role', 'group'); row.setAttribute('aria-label', c.label); box.appendChild(row);
          const btns = c.options.map(([val, txt]) => { const b = p.createButton(txt); b.parent(row); b.elt.addEventListener('click', () => { set(c.id, val); p.redraw(); }); return [val, b.elt]; });
          cell.syncers.push(() => btns.forEach(([val, el]) => el.setAttribute('aria-pressed', String(v[c.id] === val))));
        } else if (c.type === 'action') {
          const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = c.label; box.appendChild(lab);
          const b = p.createButton(c.text); b.parent(box); b.elt.addEventListener('click', () => { v[c.id] += 1; cell.sync(); p.redraw(); });
        } else {
          const lab = document.createElement('label'); lab.htmlFor = uid; box.appendChild(lab);
          let el, out = document.createElement('output');
          if (c.type === 'slider') {
            const s = p.createSlider(0, c.log ? c.steps : Math.round((c.max - c.min) / c.step), PAT.sliderIndex(c, v[c.id]), 1); s.parent(box); el = s.elt;
            s.input(() => { set(c.id, PAT.sliderValue(c, +el.value)); p.redraw(); });
            cell.syncers.push(() => { const idx = PAT.sliderIndex(c, v[c.id]); if (+el.value !== idx) el.value = idx; out.textContent = `${v[c.id]} ${c.unit || ''}`; el.setAttribute('aria-valuetext', `${v[c.id]} ${c.unit || ''}`); });
          } else {
            const s = p.createInput(String(v[c.id]), 'number'); s.parent(box); el = s.elt;
            el.min = c.min; el.max = c.max; el.step = c.step; el.inputMode = 'decimal';
            s.input(() => { const x = parseFloat(el.value); if (isFinite(x)) { set(c.id, x); p.redraw(); } });
            cell.syncers.push(() => { if (document.activeElement !== el) el.value = v[c.id]; });
          }
          el.id = uid; lab.textContent = c.label + ' '; if (c.type === 'slider') lab.appendChild(out);
        }
      });
      cell.sync = () => cell.syncers.forEach(f => f());
      cell.render = () => {
        PAT.draw(p, 0, cell.st, {}, tokens);
        const l = PAT.lines(kind, cell.st.vals, cell.st);
        sec.querySelector('.read').innerHTML = l.map(s => `<span>${s}</span>`).join('');
      };
      cell.sync();
      cell.ready = true;
      if (NAMES.every(n => cells[n] && cells[n].ready)) { ready = true; resolveReady(); }
    };
    p.draw = () => cell.render();
  });
}

function activate(name) {
  active = name;
  NAMES.forEach(n => { const c = cells[n]; if (c) c.sec.hidden = n !== name; });
  cells[name].sec.hidden = false; STAGE.prepend(cells[name].sec);   // active canvas first in DOM order
  [...TABS.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.name === name)));
  document.getElementById('ttl').textContent = PAT.CLAIMS[cells[name].kind].title;
  cells[name].render();
}
NAMES.forEach(n => { const b = document.createElement('button'); b.textContent = n; b.dataset.name = n; b.addEventListener('click', () => activate(n)); TABS.appendChild(b); });

// the harness / ?variant=&t= door: a scripted path over t sets state, the same state a user would set by hand
function seek(t, variant) {
  const name = cells[variant] ? variant : (active || NAMES[0]), c = cells[name];
  if (name !== active) activate(name);
  Object.assign(c.st.vals, PAT.pathAt(c.kind, t, PAT.params.dur)); c.sync(); c.render();
}
window.__film = {
  info: { variants: NAMES, dur: PAT.params.dur, brand: brandId, kind: 'explorable' },
  ready: () => readyP.then(() => document.fonts.ready).then(() => { if (!window.__film.done) { window.__film.done = true; activate(qs.get('variant') && cells[qs.get('variant')] ? qs.get('variant') : NAMES[0]); if (qs.has('t')) seek(+qs.get('t'), active); } }),
  seek,
};
Promise.all([...new Set(['disp', 'mono', 'body'].map(k => tokens.type[k]))].map(f => document.fonts.load(`${f.weight} 16px "${f.family}"`))).catch(() => {}).then(() => NAMES.forEach(n => buildSection(PAT.variants.find(v => v.name === n))));
</script>
</body>
</html>
