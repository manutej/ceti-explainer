<script src="../../../vendor/p5-2.3.4.min.js"></script>
<script src="../../brands/packs.js"></script>
<script src="./pattern.js"></script>
<script>
const PAT = ARSENAL.patterns.annotations, Q = new URLSearchParams(location.search);
const TOKENS = ARSENAL.brands[Q.get('brand') || 'ceti-dark'] || ARSENAL.brands['ceti-dark'];
const cur = { name: null, state: null, params: null };
const info = { variants: PAT.variants.map(v => v.name), dur: PAT.params.dur, brand: TOKENS.id };
let ok; const readyP = new Promise(r => ok = r);
function render(t, name) {
  const v = PAT.variants.find(x => x.name === (name || Q.get('variant') || PAT.variants[0].name));
  if (cur.name !== v.name) { cur.name = v.name; cur.params = Object.assign({}, PAT.params, v.params); cur.state = PAT.setup(window._p, { seed: 7, tokens: TOKENS }, cur.params); }
  window._p.resetMatrix(); PAT.draw(window._p, t, cur.state, cur.params, TOKENS);
  info.audit = PAT.audit(window._p, cur.state, TOKENS);
}
async function setup() {
  createCanvas(960, 540); pixelDensity(2); noLoop();
  describe('Annotations: callouts, brackets, dimension lines, hand-drawn circles and underlines, pins and a spotlight label. Variants: ' + info.variants.join(', '));
  window._p = p5.instance || window;
  const fams = [TOKENS.type.disp, TOKENS.type.mono, TOKENS.type.body];
  try { await Promise.all(fams.map(f => document.fonts.load(f.weight + ' 16px "' + f.family + '"'))); } catch (e) {}
  ok(); if (Q.get('t') !== null) render(+Q.get('t'));
}
window.__film = { ready: () => readyP, seek: (t, v) => render(t, v), info };
</script></body></html>
