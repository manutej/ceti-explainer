<script>
/* ?brand=<id> (default ceti-dark) · ?variant=<name> · ?t=<s> · ?p=<json params> */
const Q = new URLSearchParams(location.search), PAT = ARSENAL.patterns['scale-anchor'], SEED = 11;
const TOK = ARSENAL.brands[Q.get('brand')] || ARSENAL.brands['ceti-dark'];
const paramsOf = n => Object.assign({}, PAT.params, PAT.variants.find(v => v.name === n).params, Q.get('p') ? JSON.parse(Q.get('p')) : {});
const NAMES = PAT.variants.map(v => v.name), cache = {}; let cur = Q.get('variant') || NAMES[0], P_inst, readyRes, last = null;
const ready = new Promise(r => readyRes = r);
document.body.style.background = TOK.color.bg;
function build(v) { if (!cache[v]) { const params = paramsOf(v); cache[v] = { params, st: PAT.setup(P_inst, { seed: SEED, w: 960, h: 540, tokens: TOK }, params) }; } cur = v; return cache[v]; }
function render(t, v) { const c = build(v || cur); last = PAT.draw(P_inst, t, c.st, c.params, TOK); return last; }
new p5(p => {
  P_inst = p;
  p.setup = () => {
    p.pixelDensity(2); p.createCanvas(960, 540); p.noLoop(); p.describe('Scale anchor: log zoom from 1 to 100,000 units against a constant-size anchor');
    const fams = Object.values(TOK.type).map(f => f.weight + ' 16px "' + f.family + '"');
    Promise.all(fams.map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => { render(+Q.get('t') || 0); readyRes(true); });
  };
});
const DUR = Math.max(...NAMES.map(n => PAT.timeline(paramsOf(n)).dur));
window.__film = { ready: () => ready, seek: (t, v) => render(t, v), count: (t, v) => PAT.count(t, paramsOf(v || cur)), timeline: v => PAT.timeline(paramsOf(v || cur)),
  info: { dur: DUR, variants: NAMES, pattern: 'scale-anchor', brand: TOK.id, renderer: 'p2d' }, stats: () => last };
</script></body></html>
