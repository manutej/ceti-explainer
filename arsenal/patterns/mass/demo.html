<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>mass · arsenal pattern</title>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:600;src:url(../../../vendor/fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(../../../vendor/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:400;src:url(../../../vendor/fonts/dm-sans-latin-400-normal.woff2) format("woff2")}

<script src="../../../vendor/p5-2.3.4.min.js"></script>
<script src="./pattern.js"></script>
<script>
// brand pack inline (file:// cannot fetch json); ?brand=<id> tries ../../brands/<id>.json when served over http
const BRAND = {"id":"ceti-dark","color":{"bg":"#0F1115","ink":"#EDE8DF","accent":"#E0B27A","accent2":"#B8322A","muted":"#8B8778","line":"rgba(237,232,223,0.18)","panel":"#171A21","chalk":"#F6F3EC"},"type":{"disp":{"family":"Big Shoulders Display","weight":600},"mono":{"family":"IBM Plex Mono","weight":400},"body":{"family":"DM Sans","weight":400}},"texture":"none","tempo":{"ease":"cubic","beat_s":4},"voice":{"register":"typeset numbers, few words","end_card":"CETI"}};
const Q = new URLSearchParams(location.search), PAT = ARSENAL.patterns.mass, DUR = 8, SEED = 23;
let tokens = BRAND, cur = null, curR = null, st = null, ready = false;
function pick() { return PAT.variants.find(v => v.name === Q.get('variant')) || PAT.variants[0]; }
function ensureCanvas(R) {
  if (curR === R) return; curR = R;
  createCanvas(960, 540, R === 'webgl' ? WEBGL : P2D); pixelDensity(2);
  const cs = document.querySelectorAll('canvas'); for (let i = 0; i < cs.length - 1; i++) cs[i].remove();
}
function build(name, over) {
  const v = PAT.variants.find(x => x.name === name) || pick(), params = Object.assign({}, PAT.params, v.params, over || {});
  ensureCanvas(PAT.rendererFor(params)); st = PAT.setup(window, { seed: SEED, w: 960, h: 540 }, params); cur = name; st.paramsUsed = params; return st;
}
function setup() { noLoop(); build(pick().name); PAT.draw(window, 0, st, st.paramsUsed, tokens); }
async function loadFonts() { await Promise.all([['600 30px "Big Shoulders Display"'], ['400 12px "IBM Plex Mono"'], ['400 12px "DM Sans"']].map(f => document.fonts.load(f[0]))); }
window.__film = {
  ready: async () => { while (!st) await new Promise(r => setTimeout(r, 20)); await loadFonts(); PAT.draw(window, 0, st, st.paramsUsed, tokens); ready = true; },
  seek(t, v) { if (v && v !== cur) build(v); PAT.draw(window, t, st, st.paramsUsed, tokens); },
  info: { variants: PAT.variants.map(v => v.name), dur: DUR },
  // cost: build one spec, draw 6 frames across the timeline, force the GPU/raster to finish each, return ms
  bench(spec) {
    const t0 = performance.now(); build(PAT.variants[0].name, spec); const setup_ms = performance.now() - t0, ms = [];
    const sync = () => { if (st.impl === 'webgl') { const gl = drawingContext; const b = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); } else drawingContext.getImageData(0, 0, 1, 1); };
    for (const f of [0.5, 0.15, 0.35, 0.5, 0.7, 0.85, 0.95]) { const a = performance.now(); PAT.draw(window, f * DUR, st, st.paramsUsed, tokens); sync(); ms.push(performance.now() - a); }
    ms.shift(); return { spec, resolved: st.impl, note: st.note, setup_ms, ms, mean: ms.reduce((a, b) => a + b, 0) / ms.length };
  },
  // the released instancing route on 2.3.4: model(geom, n) + strands instanceID(); position from the id only (no per-mark state)
  probeModelN(N) {
    try {
      ensureCanvas('webgl'); const cols = Math.round(Math.sqrt(N * 840 / 392)), cell = 840 / cols;
      const g = buildGeometry(() => { noStroke(); fill(237, 232, 223); plane(cell * 0.76, cell * 0.76); });
      const hook = new Function("return () => { worldInputs.begin(); const id = instanceID(); worldInputs.position.x += (mod(id, " + cols + ".0) + 0.5) * " + cell + " - 480.0; worldInputs.position.y += (floor(id / " + cols + ".0) + 0.5) * " + cell + " - 270.0; worldInputs.end(); }")();
      const s = baseMaterialShader().modify(hook);
      const ms = []; for (let r = 0; r < 4; r++) { const a = performance.now(); background(15, 17, 21); shader(s); model(g, N); const gl = drawingContext, b = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); ms.push(performance.now() - a); }
      ms.shift(); return { ok: true, N, mean: ms.reduce((a, b) => a + b, 0) / ms.length, ms };
    } catch (e) { return { ok: false, N, err: String(e).slice(0, 300) }; }
  },
};
