<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>gl-look</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;background:#0F1115}canvas{display:block}</style>
<script src="../../../vendor/p5-2.3.4.min.js"></script>
<script src="../../fonts/fonts.js"></script>
<script src="../../brands/packs.js"></script>
<script src="../gl-post/pattern.js"></script>
<script src="../gl-instances/pattern.js"></script>
<script src="./pattern.js"></script></head><body><main></main><div id="junk" hidden></div>
<script>
/* gl-look demo: the gl-instances box field (30k cubes) and a bar field and a point cloud under the hero look, plus the stock ink picture (level exec).
   ?brand=<id> (default ceti-dark) · ?variant=<name> · ?t=<s> · ?blocks=floor:0,shadow:0 (toggle blocks) · ?p=<json look opts> · ?aa=0 · ?ldr=1
   Marks draw into gl-post's HDR frame (linear light); gl-look.end() tone maps; type is drawn flat AFTER the post. */
const Q = new URLSearchParams(location.search), INST = ARSENAL.patterns['gl-instances'], LOOK = ARSENAL.patterns['gl-look'];
const TK = ARSENAL.brands[Q.get('brand') || 'ceti-dark'] || ARSENAL.brands['ceti-dark'];
const boxCam = { proj: 'ortho', az: [38, 58], el: [30, 22], zoom: [1.12, 1.04], look: [0, -110, 0], span: [0, 1], fov: 0.8, dist: [0, 0] };
const barCam = { proj: 'persp', az: [-24, 14], el: [48, 38], dist: [1000, 900], fov: 0.8, look: [0, 50, 30], span: [0, 1], zoom: [1, 1] };
const barP = { n: 40000, rows: 160, faces: ['-y', '+z', '+x', '-x'], barFill: 0.9, pitch3: 2.6, cam: barCam };   // the bar scene shared by ink and hero
const VARS = {
  'boxes-ink': { kind: 'inst', base: 'boxes-30k', level: 'exec', params: {} },
  'boxes-hero': { kind: 'inst', base: 'boxes-30k', level: 'manager', params: { ao: 0.9, hero: 'top', hud: false, cam: boxCam }, look: { plate: [0, 0, 400, 140], pool: 700, plateSoft: 45, floorY: 0 } },
  'bars-ink': { kind: 'inst', base: 'bars-100k', level: 'exec', params: barP },
  'bars-hero': { kind: 'inst', base: 'bars-100k', level: 'manager', params: Object.assign({ ao: 0.9, hero: 'top', hud: false }, barP), look: { plate: [0, 0, 540, 330], pool: 760, floorY: 0, plateSoft: 60 } },
  'cloud-hero': { kind: 'cloud', level: 'manager', look: { plate: [0, 0, 330, 150], pool: 520, floorY: 0, plateSoft: 50 } },
  'cloud-ink': { kind: 'cloud', level: 'exec', look: {} },
};
const NAMES = Q.get('only') ? [Q.get('only')] : Object.keys(VARS), DUR = 10, fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const optsQ = Q.get('p') ? JSON.parse(Q.get('p')) : {};
function blocksQ() { const b = {}; (Q.get('blocks') || '').split(',').filter(Boolean).forEach((kv) => { const [k, v] = kv.split(':'); b[k] = v === '1'; }); return b; }
let P = null, F = {}, cache = {}, cur = null, last = null, resolveReady; const readyP = new Promise((r) => (resolveReady = r));

/* ---------- point cloud: sphere impostors from one hand-built geometry (4 verts per point; aNormal = role, size, rank) ---------- */
const CV = `#version 300 es
precision highp float; in vec3 aPosition; in vec3 aNormal; in vec2 aTexCoord;
uniform mat4 uModelViewMatrix; uniform mat4 uProjectionMatrix; uniform float uK, uWin, uSh0; uniform vec4 uSh; uniform float uFloorY; uniform vec3 uPal[6]; uniform float uHero; uniform vec3 uHeroCol;
out vec2 vQ; out vec3 vAlb; out vec3 vW; out float vHero; out float vA;
void main(){
  float rank = aNormal.z, age = clamp((uK - rank) / uWin, 0.0, 1.0), e = age * age * (3.0 - 2.0 * age), s = aNormal.y * e;
  vec2 c = aTexCoord * 2.0 - 1.0; vQ = c; vHero = (uHero >= 0.0 && abs(rank - uHero) < 0.5) ? 1.0 : 0.0;
  vAlb = vHero > 0.5 ? uHeroCol : uPal[int(aNormal.x + 0.5)]; vW = aPosition; vA = 1.0;
  if (rank >= uK || s <= 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  if (uSh.w > 0.5) {                                          // blob shadow: a disc on the floor under the point, sheared along the key; softer with height
    float hgt = uFloorY - aPosition.y; vec3 g = aPosition + uSh.xyz * (hgt / uSh.y); g.y = uFloorY - 0.5;
    vec3 w = g + vec3(c.x, 0.0, c.y) * s * (1.0 + 0.012 * hgt); vW = w; vA = 1.0 / (1.0 + (hgt / 150.0) * (hgt / 150.0));
    gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(w, 1.0); return;
  }
  vec4 v = uModelViewMatrix * vec4(aPosition, 1.0); v.xy += c * s; gl_Position = uProjectionMatrix * v;
}`;
const CF = `#version 300 es
precision highp float; in vec2 vQ; in vec3 vAlb; in vec3 vW; in float vHero; in float vA;
uniform mat4 uModelViewMatrix; uniform float uShadowOn, uShadowA, uRimK; uniform vec3 uKeyDir, uFillDir, uRimDir, uKey, uFill, uSky, uGnd, uRimC;
//@FLOOR
out vec4 o;
void main(){
  float r2 = dot(vQ, vQ);
  if (uShadowOn > 0.5) { o = vec4(floorCol(vW.xz) * (1.0 - uShadowA * vA * (1.0 - smoothstep(0.3, 1.0, r2))), 1.0); if (r2 > 1.0) discard; return; }
  if (r2 > 1.0) discard;
  vec3 nV = vec3(vQ.x, vQ.y, sqrt(1.0 - r2)), n = transpose(mat3(uModelViewMatrix)) * nV;   // sphere impostor normal, view -> world
  float kd = max((dot(n, -uKeyDir) + 0.25) / 1.25, 0.0), fd = max((dot(n, -uFillDir) + 0.25) / 1.25, 0.0);
  vec3 l = mix(uGnd, uSky, 0.5 - 0.5 * n.y) + uFill * fd + uKey * kd;
  vec3 rim = uRimC * uRimK * pow(1.0 - nV.z, 3.0) * smoothstep(-0.2, 0.6, dot(n, -uRimDir));
  o = vec4(vHero > 0.5 ? vAlb * mix(0.8, 1.0, kd) + rim : vAlb * l + rim, 1.0);
}`;
function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function cloudSetup(p, lk) {
  const N = 4000, rng = mulberry(11), g = () => Math.sqrt(-2 * Math.log(Math.max(rng(), 1e-12))) * Math.cos(6.2832 * rng()), pts = [];
  for (let i = 0; i < N; i++) { const b = rng() < 0.22; pts.push(b ? { x: 150 + 55 * g(), y: -120 - 40 * Math.abs(g()), z: 20 + 40 * g(), c: 1, s: 3 } : { x: -40 + 130 * g(), y: -60 - 55 * Math.abs(g()), z: 10 + 45 * g(), c: 0, s: 2.6 }); }
  let top = -1; pts.forEach((q, i) => { if (q.c === 1 && Math.abs(q.x - 150) < 60 && (top < 0 || q.y < pts[top].y)) top = i; }); pts[top].s = 7;   // the hero point, the highest, drawn larger
  const ord = pts.map((_, i) => i).sort((a, b) => (a === top ? 1 : b === top ? -1 : 0) || rng() - 0.5);   // seeded arrival; the hero last
  const rank = new Int32Array(N); ord.forEach((id, r) => (rank[id] = r));
  const geom = new p5.Geometry(1, 1, null, p._renderer), C = [[0, 0], [1, 0], [1, 1], [0, 1]];
  pts.forEach((q, i) => { for (const [u, v] of C) { geom.vertices.push(p.createVector(q.x, q.y, q.z)); geom.uvs.push(u, v); geom.vertexNormals.push(p.createVector(q.c, q.s, rank[i])); }
    const b = i * 4; geom.faces.push([b, b + 1, b + 2], [b, b + 2, b + 3]); });
  geom.gid = 'cloud-' + N;
  return { N, geom, hero: rank[top], cam: lk.hdr.createCamera(), sh: p.createShader(CV, CF.replace('//@FLOOR', lk.glsl)) };
}
function cloudDraw(p, t, cs, lk, ink, TKn) {
  const u = Math.min(1, t / DUR), e = u * u * (3 - 2 * u), az = (-30 + 52 * e) * Math.PI / 180, el = (26 - 4 * e) * Math.PI / 180, d = 820 - 90 * e;
  const L = [0, -80, 0], eye = [L[0] + d * Math.sin(az) * Math.cos(el), L[1] - d * Math.sin(el), L[2] + d * Math.cos(az) * Math.cos(el)], pose = { eye, look: L };
  cs.cam.camera(eye[0], eye[1], eye[2], L[0], L[1], L[2], 0, 1, 0); cs.cam.perspective(0.8, p.width / p.height, 10, 8000);
  if (lk && lk.jit) lk.jitter(cs.cam);
  p.setCamera(cs.cam); p.noStroke(); p.noLights();
  const front = cs.N * 1.05 * Math.min(1, Math.max(0, (u - 0.05) / 0.6)), k = Math.min(cs.N, Math.floor(front)), sh = cs.sh;   // the front runs past N so the last arrivals settle
  if (lk) lk.floor(p);
  p.shader(sh); sh.setUniform('uK', front); sh.setUniform('uWin', 160); sh.setUniform('uSh', [0, 1, 0, 0]); sh.setUniform('uShadowOn', 0); sh.setUniform('uFloorY', 0);
  const roles = ['muted', 'accent', 'accent2', 'ink', 'chalk', 'panel'];
  if (lk) lk.bind(sh, pose, { roles, dim: 0.5, hero: cs.hero, ao: 0 });
  else { const c = (r) => { const q = p.color(TKn.color[r]); return [p.red(q) / 255, p.green(q) / 255, p.blue(q) / 255]; }; sh.setUniform('uPal', roles.flatMap(c)); sh.setUniform('uSky', [0.5, 0.5, 0.5]); sh.setUniform('uGnd', [0.3, 0.3, 0.3]); sh.setUniform('uKey', [0.5, 0.5, 0.5]); sh.setUniform('uFill', [0, 0, 0]); sh.setUniform('uKeyDir', [-0.45, 0.8, -0.4]); sh.setUniform('uFillDir', [0.5, 0.2, 0.5]); sh.setUniform('uRimDir', [0.7, 0.3, 0.6]); sh.setUniform('uRimC', [1, 1, 1]); sh.setUniform('uRimK', 0); sh.setUniform('uHero', -1); }
  if (lk && lk.shadow) { sh.setUniform('uShadowOn', 1); sh.setUniform('uSh', lk.shadowDir(pose)); p.blendMode(p.DARKEST); p.model(cs.geom); p.blendMode(p.BLEND); sh.setUniform('uShadowOn', 0); sh.setUniform('uSh', [0, 1, 0, 0]); }
  p.model(cs.geom); p.resetShader();
  return { k, n: cs.N };
}

new p5((p) => {
  P = p;
  p.setup = async () => { await p.createCanvas(960, 540, p.WEBGL); if (Q.get('aa') === '0') await p.setAttributes('antialias', false); p.pixelDensity(2); p.noLoop();
    F = await INST.load(p, TK); resolveReady(); };
  p.draw = () => {};
}, document.querySelector('main'));
function tidy() { document.querySelectorAll('canvas:not(.p5Canvas)').forEach((c) => document.getElementById('junk').appendChild(c)); }
function build(v) {
  const V = VARS[v], t0 = performance.now();
  const lkO = Object.assign({ level: V.level, seed: 7, w: 960, h: 540, tokens: TK, forceLDR: Q.get('ldr') === '1', blocks: blocksQ() }, V.look, optsQ);
  const st = LOOK.setup(P, TK, lkO), C = { v, V, st, lk: LOOK.attach(st) };
  if (V.kind === 'inst') {
    const base = INST.variants.find((x) => x.name === V.base).params, params = Object.assign({}, INST.params, base, V.params, { look: C.lk });
    C.params = params; C.is = INST.setup(P, { seed: 7, fonts: F, tokens: TK }, params);
  } else C.cs = cloudSetup(P, C.lk || { hdr: { createCamera: () => P.createCamera() }, glsl: 'vec3 floorCol(vec2 q){ return vec3(0.0); }' });
  C.setupMs = performance.now() - t0; return C;
}
function labels(C, out, res, t) {
  const p = P, c = TK.color, ox = -480, oy = -270, V = C.V;
  const txt = (s, x, y, size, col, font, al) => { p.noStroke(); p.fill(col); p.textFont(font); p.textSize(size); p.textAlign(al || p.LEFT, p.BASELINE); p.text(s, x + ox - (al === p.RIGHT ? 2000 : 0), y + oy, 2000); };
  p.push(); p.resetMatrix(); p.setCamera(C.st.on ? C.st.post.cam0 : C.cam0 || (C.cam0 = p.createCamera())); p.clearDepth();
  const noun = V.kind === 'cloud' ? 'POINTS' : V.base === 'bars-100k' ? 'BARS' : 'CASES';
  txt(fmt(out.k), 36, 470, 66, out.k > 0 ? c.accent : c.ink, F.disp); txt('OF ' + fmt(out.n) + ' ' + noun + ' SHOWN', 38, 498, 13, c.muted, F.mono);
  const lad = C.st.ladder, on = res && res.gains ? ['tonemap', 'bloom', 'vignette', 'grain'].filter((k) => res.gains[k] > 0 || k === 'tonemap').join(' · ').toUpperCase() : 'NONE';
  txt(C.st.on ? 'HERO LOOK · LADDER BG ' + lad.bg + ' % · POOL ' + lad.pool + ' % · MARKS ' + lad.marks.join('-') + ' % · HERO ' + lad.hero.join('-') + ' %' : 'INK · LEVEL EXEC · NO LOOK', 924, 40, 12, c.muted, F.mono, p.RIGHT);
  txt(C.st.on ? 'POST ' + on : 'STOCK PICTURE', 924, 58, 12, c.muted, F.mono, p.RIGHT);
  p.pop();
}
function seek(t, v) {
  v = v || Q.get('variant') || NAMES[0]; if (!cache[v]) cache[v] = build(v);
  const C = cache[v], p = P; p.resetMatrix(); let out, res = null;
  if (C.st.on) {
    const acc = optsQ.accum || null;
    const drawFn = (pp, tk) => { pp.resetMatrix(); return C.V.kind === 'inst' ? INST.draw(pp, tk, C.is, C.params, TK) : cloudDraw(pp, tk, C.cs, C.lk, false, TK); };
    if (Q.get('be')) { LOOK.begin(p, t, C.st); out = drawFn(p, t); res = LOOK.end(p, t, C.st); }   // the begin / end pair instead of render()
    else { res = LOOK.render(p, t, C.st, drawFn, acc); out = res.out; }
    if (C.V.kind === 'inst') out.k = INST.count(t, C.is, C.params);
  } else if (C.V.kind === 'inst') { out = INST.draw(p, t, C.is, C.params, TK); }
  else { p.background(TK.color.bg); out = cloudDraw(p, t, C.cs, null, true, TK); }
  if (C.V.kind === 'inst' && !C.st.on) { /* stock picture: gl-instances draws its own hud */ } else labels(C, out, res, t);
  tidy(); cur = v;
  const gl = P._renderer.GL, px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);   // sync: the GPU has finished this frame
  last = { v, t, level: C.st.level, k: out.k, ran: res && res.ran };
  return last;
}
window.__film = { ready: () => readyP.then(() => { if (Q.has('t')) seek(+Q.get('t')); }), seek, info: { variants: NAMES, dur: DUR, brand: TK.id, renderer: 'webgl' },
  stats: () => ({ variant: cur, last, setupMs: cache[cur] && cache[cur].setupMs, ladder: cache[cur] && cache[cur].st.ladder, err: cache[cur] && cache[cur].st.post && cache[cur].st.post.err }) };
</script></body></html>
