<script>
(function () {
  const Q = new URLSearchParams(location.search), pat = ARSENAL.patterns['glyphs-iso'], SEED = 11;
  const names = pat.variants.map(v => v.name), states = {};
  let P5, resolveReady, cur = Q.get('variant') || names[0];
  const ready = new Promise(r => (resolveReady = r));
  function show(t, name) {
    name = name || cur; cur = name;
    const v = pat.variants.find(x => x.name === name), tk = ARSENAL.brands[Q.get('brand') || 'ceti-dark'];
    if (!states[name]) states[name] = pat.setup(P5, { seed: SEED, tokens: tk }, v.params);
    pat.draw(P5, t, states[name], v.params, tk);
  }
  window.__film = { ready: () => ready, seek: (t, v) => show(t, v), info: { variants: names, dur: Math.max(...pat.variants.map(v => v.params.dur)), durs: Object.fromEntries(pat.variants.map(v => [v.name, v.params.dur])), seed: SEED } };
  new p5(p => {
    P5 = p;
    p.setup = async () => {
      p.createCanvas(960, 540); p.pixelDensity(2); p.noLoop();
      const faces = new Set(); Object.values(ARSENAL.brands).forEach(b => Object.values(b.type).forEach(f => faces.add(f.weight + ' 20px "' + f.family + '"')));
      await Promise.all([...faces].map(f => document.fonts.load(f))); await document.fonts.ready;
      show(+(Q.get('t') || 0), cur); resolveReady();
    };
  });
})();
