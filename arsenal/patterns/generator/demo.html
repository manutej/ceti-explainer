<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Generator scene demo</title>
<style>html,body{margin:0;background:#0F1115}canvas{display:block}</style>

<script src="./pattern.js"></script></head><body>
<script>
/* standalone demo: ?variant=<name>&t=<seconds>. Window hook: __film { ready(), seek(t, variant), info } */
const BRAND = { id: 'ceti-dark', color: { bg: '#0F1115', ink: '#EDE8DF', accent: '#E0B27A', accent2: '#B8322A', muted: '#8B8778', line: 'rgba(237,232,223,0.18)', panel: '#171A21', chalk: '#F6F3EC' },
  type: { disp: { family: 'Big Shoulders Display', weight: 600 }, mono: { family: 'IBM Plex Mono', weight: 400 }, body: { family: 'DM Sans', weight: 400 } },
  texture: 'none', tempo: { ease: 'cubic', beat_s: 4 }, voice: { register: 'typeset numbers, few words', end_card: 'CETI' } };
const PAT = ARSENAL.patterns['generator'], Q = new URLSearchParams(location.search);
const cache = {}; let cur = Q.get('variant') || PAT.variants[0].name, T = +(Q.get('t') || 0), resolveReady;
const readyP = new Promise((r) => (resolveReady = r));
function stateOf(name) {
  if (!cache[name]) { const v = PAT.variants.find((x) => x.name === name) || PAT.variants[0]; cache[name] = PAT.setup(window, { seed: PAT.params.seed }, v.params); }
  return cache[name];
}
function render(t, name) { cur = name || cur; T = t; PAT.draw(window, t, stateOf(cur), PAT.params, BRAND); }
function setup() { createCanvas(960, 540); pixelDensity(2); noLoop(); render(T, cur); resolveReady(true); }
function draw() {}
window.__film = { ready: () => readyP, seek: (t, v) => { render(t, v); return { t, variant: cur }; },
  info: { id: 'generator', variants: PAT.variants.map((v) => v.name), dur: PAT.params.dur, brand: BRAND.id } };
</script></body></html>
