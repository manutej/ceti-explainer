<style>
  :root {
    --ex-ground:#0E1014; --ex-ground-2:#0B0D11; --ex-ground-hi:#14181F;
    --ex-panel-hi:#12161D; --ex-panel-lo:#0F1217;
    --ex-ink:#F5EFE3; --ex-dim:#A39A89;
    --ex-line:rgba(245,239,227,0.13); --ex-line-2:rgba(245,239,227,0.07);
    --ex-panel:#171B23; --ex-cell:#1C212B; --ex-bar:rgba(245,239,227,0.22);
    --ex-accent:#CE9A6A; --ex-accent-fill:rgba(206,154,106,0.15); --ex-accent-glow:rgba(206,154,106,0.35);
    --ex-accent2:#8FA985; --ex-support:#6E8CA8; --ex-peach:#D88B5C;
    --ex-pace:1;
  }
  html { scroll-behavior:smooth; }
  body {
    margin:0;
    background:radial-gradient(120% 80% at 50% -10%, var(--ex-ground-hi) 0%, var(--ex-ground) 46%, var(--ex-ground-2) 100%);
    color:var(--ex-ink); font-family:var(--font-sans); -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  ::selection { background:var(--ex-accent-glow); color:#fff; }

  .ex-topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:var(--space-4);
    height:56px; padding:0 var(--gutter); background:rgba(14,16,20,0.78); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--ex-line-2); }
  .ex-brand { display:flex; align-items:center; gap:10px; }
  .ex-brand svg { width:26px; height:16px; color:var(--ex-accent); }
  .ex-brand b { font-family:var(--font-mono); font-weight:700; font-size:13px; letter-spacing:0.04em; color:var(--ex-ink); }
  .ex-back { margin-left:auto; display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.04em; color:var(--ex-dim);
    text-decoration:none; transition:color .18s var(--ease-warm-in); }
  .ex-back:hover { color:var(--ex-ink); }

  .ex-wrap { max-width:1080px; margin:0 auto; padding:clamp(1.25rem,3vw,2rem) var(--gutter) 4rem; }

  .ex-eyebrow { font-family:var(--font-mono); font-weight:700; font-size:var(--t-eyebrow);
    letter-spacing:0.22em; text-transform:uppercase; color:var(--ex-accent); margin:0 0 var(--space-3); }
  .ex-title { font-family:var(--font-display); font-weight:300; font-style:italic;
    font-size:clamp(2.1rem,4.4vw,3.2rem); line-height:1.02; letter-spacing:-0.02em;
    margin:0 0 var(--space-3); color:var(--ex-ink); }
  .ex-lede { font-family:var(--font-sans); font-size:clamp(0.95rem,1.3vw,1.08rem); line-height:1.55;
    color:var(--ex-dim); max-width:64ch; margin:0 0 var(--space-5); text-wrap:pretty; }
  .ex-lede em { color:var(--ex-ink); font-style:italic; font-family:var(--font-display); font-weight:300; }

  .ex-player { outline:none; }
  .ex-stage-frame { position:relative; border:1px solid var(--ex-line); border-radius:var(--radius-xl);
    background:linear-gradient(180deg,var(--ex-panel-hi) 0%,var(--ex-panel-lo) 100%);
    box-shadow:0 0 0 1px rgba(0,0,0,0.3), 0 30px 70px -40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(245,239,227,0.05);
    overflow:hidden; }
  .ex-stage-head { display:flex; align-items:center; gap:var(--space-3); padding:12px 18px; border-bottom:1px solid var(--ex-line-2); }
  .ex-stage-tag { font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; color:var(--ex-dim);
    text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ex-live { margin-left:auto; display:inline-flex; align-items:center; gap:7px;
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; color:var(--ex-dim); }
  .ex-live .dot { width:7px; height:7px; border-radius:50%; background:var(--ex-dim); }
  .ex-player.is-playing .ex-live .dot { background:var(--ex-accent); animation:exPulse 1.8s var(--ease-rest) infinite; }
  .ex-player.is-playing .ex-live { color:var(--ex-accent); }
  @keyframes exPulse { 0%{box-shadow:0 0 0 0 var(--ex-accent-glow);} 70%{box-shadow:0 0 0 6px rgba(206,154,106,0);} 100%{box-shadow:0 0 0 0 rgba(206,154,106,0);} }

  .ex-stage { position:relative; width:100%; aspect-ratio:1000/464; display:block; }
  .ex-stage svg { display:block; }

  .ex-caption-band { display:grid; grid-template-columns:auto 1fr; gap:var(--space-4); align-items:start;
    padding:18px 22px; border-top:1px solid var(--ex-line-2); background:rgba(8,10,13,0.5); min-height:92px; }
  .ex-caption-meta { display:flex; flex-direction:column; gap:4px; padding-top:2px; }
  .ex-caption-meta .n { font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--ex-accent);
    line-height:1; font-variant-numeric:tabular-nums; }
  .ex-caption-meta .l { font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ex-dim); max-width:12ch; }
  .ex-caption { font-family:var(--font-sans); font-size:clamp(1.05rem,1.7vw,1.32rem); line-height:1.45;
    color:var(--ex-ink); align-self:center; text-wrap:pretty; opacity:0; transition:opacity .45s var(--ease-defer); }
  .ex-caption.is-in { opacity:1; }

  .ex-controls { display:flex; align-items:center; gap:var(--space-4); padding:16px 22px; border-top:1px solid var(--ex-line-2); }
  .ex-btn { display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--ex-line);
    background:var(--ex-panel); color:var(--ex-ink); border-radius:var(--radius-pill); cursor:pointer; padding:0;
    transition:border-color .18s var(--ease-warm-in), background .18s var(--ease-warm-in), filter .18s; }
  .ex-btn:hover { border-color:var(--ex-accent); filter:brightness(1.08); }
  .ex-btn:active { transform:translateY(1px); }
  .ex-btn:focus-visible { box-shadow:0 0 0 3px var(--ex-accent-glow); outline:none; }
  .ex-btn svg { width:18px; height:18px; }
  .ex-btn--ghost { width:40px; height:40px; }
  .ex-btn--play { width:52px; height:52px; background:var(--ex-accent); border-color:var(--ex-accent); color:#14161A;
    box-shadow:0 6px 22px -8px var(--ex-accent-glow); }
  .ex-btn--play:hover { filter:brightness(1.06); }
  .ex-btn--play svg { width:22px; height:22px; }
  .ex-btn--play .ic-pause { display:none; }
  .ex-btn--play[data-state="playing"] .ic-play { display:none; }
  .ex-btn--play[data-state="playing"] .ic-pause { display:block; }

  .ex-scrub { position:relative; flex:1; height:26px; display:flex; align-items:center; cursor:pointer; touch-action:none; }
  .ex-scrub__track { position:relative; width:100%; height:4px; border-radius:999px; background:rgba(245,239,227,0.12); }
  .ex-scrub__progress { position:absolute; left:0; top:0; height:100%; width:0%; background:var(--ex-accent); border-radius:999px; }
  .ex-tick { position:absolute; top:50%; width:2px; height:9px; transform:translate(-50%,-50%); background:rgba(245,239,227,0.28); border-radius:1px; }
  .ex-scrub__handle { position:absolute; top:50%; left:0%; width:13px; height:13px; border-radius:50%;
    transform:translate(-50%,-50%); background:var(--ex-ink); box-shadow:0 0 0 4px rgba(206,154,106,0.18), 0 2px 6px rgba(0,0,0,0.5); pointer-events:none; }
  .ex-time { font-family:var(--font-mono); font-size:12px; color:var(--ex-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ex-time b { color:var(--ex-ink); font-weight:400; }

  .ex-chapters { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:var(--space-4); }
  .ex-chapter { display:flex; align-items:center; gap:10px; text-align:left; padding:11px 14px;
    border:1px solid var(--ex-line-2); border-radius:var(--radius); background:transparent; color:var(--ex-dim); cursor:pointer;
    transition:border-color .2s var(--ease-warm-in), color .2s, background .2s; }
  .ex-chapter:hover { border-color:var(--ex-line); color:var(--ex-ink); }
  .ex-chapter__n { font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--ex-dim); font-variant-numeric:tabular-nums; }
  .ex-chapter__l { font-family:var(--font-sans); font-size:13px; font-weight:500; line-height:1.2; }
  .ex-chapter.is-done .ex-chapter__n { color:var(--ex-accent2); }
  .ex-chapter.is-active { border-color:var(--ex-accent); background:var(--ex-accent-fill); color:var(--ex-ink); }
  .ex-chapter.is-active .ex-chapter__n { color:var(--ex-accent); }
  .ex-chapter:focus-visible { outline:none; box-shadow:0 0 0 3px var(--ex-accent-glow); }

  .ex-hint { margin-top:var(--space-4); font-family:var(--font-mono); font-size:11px; color:var(--ex-dim);
    letter-spacing:0.03em; display:flex; gap:18px; flex-wrap:wrap; }
  .ex-hint kbd { font-family:var(--font-mono); font-size:10px; color:var(--ex-ink); border:1px solid var(--ex-line);
    border-radius:4px; padding:1px 6px; background:var(--ex-panel); }

  .ex-synth { margin-top:var(--space-9); padding-top:var(--space-7); border-top:1px solid var(--ex-line-2);
    display:grid; grid-template-columns:1fr; gap:var(--space-5); max-width:860px; }
  .ex-synth h2 { font-family:var(--font-display); font-weight:300; font-style:italic; font-size:var(--t-display);
    letter-spacing:-0.02em; margin:0; color:var(--ex-ink); }
  .ex-synth p { font-family:var(--font-sans); font-size:1.06rem; line-height:1.7; color:var(--ex-dim); margin:0; text-wrap:pretty; }
  .ex-synth p em { color:var(--ex-ink); font-style:italic; font-family:var(--font-display); font-weight:300; }
  .ex-footer { margin-top:var(--space-9); padding-top:var(--space-5); border-top:1px solid var(--ex-line-2);
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.04em; color:var(--ex-dim); }

  /* ───────────── Tweaks panel (vanilla, no dependencies) ───────────── */
  .tw-fab { position:fixed; right:18px; bottom:18px; z-index:60; width:46px; height:46px; border-radius:50%;
    border:1px solid var(--ex-line); background:var(--ex-panel); color:var(--ex-ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 26px -12px rgba(0,0,0,0.8);
    transition:border-color .18s, filter .18s; }
  .tw-fab:hover { border-color:var(--ex-accent); filter:brightness(1.08); }
  .tw-fab svg { width:20px; height:20px; }
  .tw-panel { position:fixed; right:18px; bottom:74px; z-index:60; width:260px; padding:16px 16px 18px;
    border:1px solid var(--ex-line); border-radius:var(--radius-lg); background:rgba(20,24,31,0.96);
    backdrop-filter:blur(12px); box-shadow:0 20px 50px -24px rgba(0,0,0,0.9);
    display:none; flex-direction:column; gap:14px; }
  .tw-panel.is-open { display:flex; }
  .tw-sec { font-family:var(--font-mono); font-size:9px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--ex-dim); margin:2px 0 -4px; }
  .tw-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .tw-row label { font-family:var(--font-sans); font-size:13px; color:var(--ex-ink); }
  .tw-val { font-family:var(--font-mono); font-size:11px; color:var(--ex-dim); font-variant-numeric:tabular-nums; }
  .tw-range { width:100%; accent-color:var(--ex-accent); }
  .tw-swatches { display:flex; gap:8px; }
  .tw-sw { width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
  .tw-sw.is-on { border-color:var(--ex-ink); }
  .tw-toggle { position:relative; width:38px; height:22px; border-radius:999px; border:1px solid var(--ex-line);
    background:var(--ex-cell); cursor:pointer; padding:0; transition:background .18s; }
  .tw-toggle::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--ex-dim); transition:transform .18s var(--ease-warm-in), background .18s; }
  .tw-toggle.is-on { background:var(--ex-accent-fill); border-color:var(--ex-accent); }
  .tw-toggle.is-on::after { transform:translateX(16px); background:var(--ex-accent); }

  @media (max-width:760px) {
    .ex-chapters { grid-template-columns:repeat(2,1fr); }
    .ex-caption-band { grid-template-columns:1fr; gap:8px; }
    .ex-caption-meta { flex-direction:row; align-items:baseline; gap:10px; }
  }
  @media (prefers-reduced-motion: reduce) { .ex-player.is-playing .ex-live .dot { animation:none; } }
</style>

  <script>
  (function () {
    var content = window.EXPLAINER;
    var m = content.meta;
    document.querySelector("[data-meta-eyebrow]").textContent = m.eyebrow;
    document.querySelector("[data-meta-title]").textContent = m.title;
    document.querySelector("[data-meta-lede]").innerHTML = m.lede;
    document.querySelector("[data-meta-tag]").textContent = m.tag;
    document.querySelector("[data-meta-synthesis]").textContent = m.synthesis;
    if (m.synthTitle) document.querySelector("[data-meta-synthtitle]").innerHTML = m.synthTitle;
    document.title = m.title + " · __BRAND_JS__";

    var root = document.querySelector("[data-ex-root]");
    var liveText = document.querySelector("[data-live-text]");
    var ctrl = window.CetiExplainer.create({ root: root, content: content, storageKey: m.id || "episode" });
    window.__ctrl = ctrl;
    function syncLive() { liveText.textContent = ctrl.playing ? "PLAYING" : "PAUSED"; requestAnimationFrame(syncLive); }
    requestAnimationFrame(syncLive);

    /* ── vanilla tweaks wiring ── */
    function hexToRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function rgba(h,a){var c=hexToRgb(h);return "rgba("+c[0]+", "+c[1]+", "+c[2]+", "+a+")";}
    var R = document.documentElement.style;
    var fab=document.getElementById("tw-fab"), panel=document.getElementById("tw-panel");
    fab.addEventListener("click", function(){ panel.classList.toggle("is-open"); });
    var pace=document.getElementById("tw-pace"), paceVal=document.getElementById("tw-pace-val");
    pace.addEventListener("input", function(){ var v=parseFloat(pace.value); paceVal.textContent=v.toFixed(2)+"×"; ctrl.setSpeed(v); });
    document.getElementById("tw-accent").addEventListener("click", function(e){
      var b=e.target.closest(".tw-sw"); if(!b) return; var c=b.dataset.c;
      this.querySelectorAll(".tw-sw").forEach(function(s){s.classList.toggle("is-on", s===b);});
      R.setProperty("--ex-accent", c); R.setProperty("--ex-accent-fill", rgba(c,0.15)); R.setProperty("--ex-accent-glow", rgba(c,0.35));
      ctrl.rerender();
    });
    function toggle(id, on, fn){ var el=document.getElementById(id);
      el.addEventListener("click", function(){ on=!on; el.classList.toggle("is-on", on); el.setAttribute("aria-checked", on); fn(on); }); }
    toggle("tw-math", true, function(on){ if(content.setMath){ content.setMath(on); ctrl.rerender(); } });
    toggle("tw-caps", true, function(on){ var band=document.querySelector(".ex-caption-band"); if(band) band.style.display = on ? "" : "none"; });
  })();
  </script>
</body>
</html>
